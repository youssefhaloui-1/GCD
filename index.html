    <meta property="og:title" content="GCD · Gestion du Cycle Doctoral USMBA" />
    <meta property="og:description" content="Plateforme unifiée de gestion du cycle doctoral de l'USMBA : inscriptions, réinscriptions, suivi des thèses et commissions." />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <title>GCD · Gestion du Cycle Doctoral USMBA</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            }
          });
        } catch (e) {
          // Ignore
        }

        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('fetch of #<Window>') !== -1)
          )) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
